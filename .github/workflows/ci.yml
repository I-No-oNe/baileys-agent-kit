name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: dependencies
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node24-deps-${{ hashFiles('package-lock.json') }}
      - if: steps.dependencies.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - name: Validate
        run: npm test && npm run check && npm run build && npm run test:mcp && npm run wa:compat
