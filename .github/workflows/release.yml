name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

      - name: Add installation instructions to the GitHub Release
        if: steps.release.outputs.release_created == 'true'
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        with:
          script: |
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: process.env.RELEASE_TAG,
            });
            const marker = "## Install";
            if (!(release.body || "").includes(marker)) {
              const install = [
                marker,
                "",
                "Requires Node.js 20 or newer.",
                "",
                "```bash",
                "npm install baileys-agent-kit",
                "```",
                "",
                "Run the CLI without a global install:",
                "",
                "```bash",
                "npx --yes --package baileys-agent-kit baileys-agent doctor",
                "```",
                "",
                "GitHub source archives are attached below.",
              ].join("\n");
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                body: [release.body?.trim(), install].filter(Boolean).join("\n\n"),
              });
            }

      - if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@v7

      - if: steps.release.outputs.release_created == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - if: steps.release.outputs.release_created == 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - if: steps.release.outputs.release_created == 'true'
        run: npm test && npm run check && npm run build

      - name: Publish package when NPM_TOKEN is configured
        if: steps.release.outputs.release_created == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured; GitHub Release created without npm publication."
            exit 0
          fi
          npm publish --access public --provenance
