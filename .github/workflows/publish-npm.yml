name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to publish
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - id: package
        name: Verify tag and npm publication state
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$package_version" ]; then
            echo "Tag $RELEASE_TAG does not match package version $package_version."
            exit 1
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          if npm view "baileys-agent-kit@$package_version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "baileys-agent-kit@$package_version is already published; skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - id: dependencies
        if: steps.package.outputs.published != 'true'
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node24-deps-${{ hashFiles('package-lock.json') }}
      - if: steps.package.outputs.published != 'true' && steps.dependencies.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.package.outputs.published != 'true'
        run: npm test
      - if: steps.package.outputs.published != 'true'
        run: npm run check
      - if: steps.package.outputs.published != 'true'
        run: npm run build
      - if: steps.package.outputs.published != 'true'
        run: npm run test:mcp
      - if: steps.package.outputs.published != 'true'
        run: npm audit --omit=dev --audit-level=high

      - name: Publish package
        if: steps.package.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
