name: Pair WhatsApp

on:
  workflow_dispatch:
    inputs:
      account_id:
        description: Account namespace
        required: true
        default: default

permissions:
  contents: read

concurrency:
  group: pair-whatsapp-${{ inputs.account_id }}
  cancel-in-progress: true

jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node24-deps-${{ hashFiles('package-lock.json') }}
      - if: steps.dependencies.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - name: Create private pairing link
        env:
          PAIRING_BROKER_URL: ${{ secrets.PAIRING_BROKER_URL }}
          PAIRING_BROKER_SECRET: ${{ secrets.PAIRING_BROKER_SECRET }}
        run: npm run wa:pair-link
      - name: Wait for QR scan
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          PAIRING_BROKER_URL: ${{ secrets.PAIRING_BROKER_URL }}
          PAIRING_BROKER_SECRET: ${{ secrets.PAIRING_BROKER_SECRET }}
          WA_ACCOUNT_ID: ${{ inputs.account_id }}
        run: npm run wa:pair
