name: WhatsApp Action

on:
  workflow_dispatch:
    inputs:
      account_id:
        description: Account namespace
        required: true
        default: default
      action_json:
        description: One Baileys Agent Kit action as JSON
        required: true
  repository_dispatch:
    types: [whatsapp-action]

permissions:
  contents: write

concurrency:
  group: whatsapp-state-${{ inputs.account_id || github.event.client_payload.account_id || 'default' }}
  cancel-in-progress: false

jobs:
  run:
    outputs:
      result_json: ${{ steps.action.outputs.result_json }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      WA_ACCOUNT_ID: ${{ inputs.account_id || github.event.client_payload.account_id || 'default' }}
      WA_STATE_DIR: ${{ github.workspace }}/.baileys-agent-state
      WA_STATE_ENCRYPTION_KEY: ${{ secrets.WA_STATE_ENCRYPTION_KEY }}
      WA_STORAGE_BACKEND: ${{ secrets.WA_STATE_ENCRYPTION_KEY != '' && 'file' || 'upstash' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node24-deps-${{ hashFiles('package-lock.json') }}
      - if: steps.dependencies.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - id: state
        name: Restore encrypted WhatsApp state
        if: env.WA_STATE_ENCRYPTION_KEY != ''
        run: npm run wa:state -- pull
      - id: action
        name: Run WhatsApp action
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          ACTION_JSON: ${{ inputs.action_json || toJson(github.event.client_payload.action) }}
          WA_ALLOWED_RECIPIENTS: ${{ secrets.WA_ALLOWED_RECIPIENTS }}
          WA_MAX_SENDS_PER_DAY: ${{ vars.WA_MAX_SENDS_PER_DAY || '50' }}
          WA_MAX_SENDS_PER_RECIPIENT_PER_DAY: ${{ vars.WA_MAX_SENDS_PER_RECIPIENT_PER_DAY || '10' }}
          WA_MAX_UNIQUE_RECIPIENTS_PER_DAY: ${{ vars.WA_MAX_UNIQUE_RECIPIENTS_PER_DAY || '20' }}
          WA_MINIMUM_SEND_INTERVAL_MS: ${{ vars.WA_MINIMUM_SEND_INTERVAL_MS || '3500' }}
          WA_FAILURE_THRESHOLD: ${{ vars.WA_FAILURE_THRESHOLD || '3' }}
          WA_CIRCUIT_BREAKER_SECONDS: ${{ vars.WA_CIRCUIT_BREAKER_SECONDS || '1800' }}
          WA_ENABLE_GROUP_ADMIN: ${{ vars.WA_ENABLE_GROUP_ADMIN || 'false' }}
          WA_ACTION_RESULT_PATH: ${{ runner.temp }}/baileys-agent-result.json
          WA_ACTION_RESULT_DETAILS: ${{ github.event.repository.private && 'true' || 'false' }}
        run: npm run wa:run
      - name: Upload private structured result
        if: always() && github.event.repository.private
        uses: actions/upload-artifact@v7
        with:
          name: whatsapp-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/baileys-agent-result.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Save encrypted WhatsApp state
        if: always() && env.WA_STATE_ENCRYPTION_KEY != '' && steps.state.outcome == 'success'
        run: npm run wa:state -- push
